# Production stack: nginx-served frontend + uvicorn backend.
# Phase 7+: Postgres + pgvector are Supabase-managed (not in compose).
# Run from repo root:
#   docker compose -f docker-compose.prod.yml --env-file .env up --build
# Public URL via:
#   ngrok http 80      (any --domain flag is fine for stable URLs)

services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: ./backend
    expose:
      - "8000"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      MODEL: ${MODEL:-gemini/gemini-3.1-flash-lite}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-gemini-embedding-2}
      DAILY_CAP: ${DAILY_CAP:-50}
      DATABASE_URL: ${DATABASE_URL}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      LLM_SOFT_CAP_USD: ${LLM_SOFT_CAP_USD:-2.00}
      LLM_HARD_CAP_USD: ${LLM_HARD_CAP_USD:-3.00}
      UPLOADS_PATH: /data/uploads
      # Same-origin via nginx — no browser-side CORS preflight needed.
      # Keep the localhost dev origin too in case you reverse-proxy directly.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://localhost:5173}
      LLM_STUB: ${LLM_STUB:-0}
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s
