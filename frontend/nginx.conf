# F-42: per-IP request throttle for the API path. 10 r/s steady with a burst
# of 20 absorbs legitimate UI bursts (parallel loads on Home) while blocking
# request floods. Applies to nginx-fronted deploys (docker compose) only --
# the Render backend has no nginx tier; its guard remains the daily LLM caps.
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

server {
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # F-62: connect-src is 'self' + supabase. nginx-served builds MUST use a
    # relative VITE_API_BASE_URL (/api). An absolute API origin baked at build
    # time would be blocked by this CSP -- add it to connect-src if you ever
    # need one.
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://*.supabase.co; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Non-privileged port: the container runs as the unprivileged nginx user,
    # which cannot bind ports below 1024. Host-side 80 maps to this in compose.
    listen 8080;
    server_name _;

    # SPA root.
    root /usr/share/nginx/html;
    index index.html;

    # gzip text assets.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Reverse-proxy API to the backend service. Single-origin keeps CORS out
    # of the picture when serving the SPA behind ngrok.
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        limit_req_status 429;
        proxy_pass         http://backend:8000/api/;
        proxy_http_version 1.1;
        # Explicit upstream host (= backend:8000) rather than the attacker-
        # controllable client Host header. Backend builds no URLs from Host.
        proxy_set_header   Host              $proxy_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location = /health {
        proxy_pass         http://backend:8000/health;
        proxy_http_version 1.1;
    }

    # Long-cache static asset bundles (they're content-hashed by Vite).
    # Cache-Control is set via `expires` (not add_header) so nginx's
    # server-block security headers are not overridden — any add_header in a
    # location block silently drops all server-block add_header directives.
    location /assets/ {
        expires 30d;
        try_files $uri =404;
    }

    # SPA fallback for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
