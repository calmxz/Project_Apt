const LEVEL_PATH = 'M2 17 L22 7'
const LEVEL_W = { beginner: 1.5, intermediate: 2.25, advanced: 3 }
const levelMark = (lvl) => `<svg class="mark level-mark${lvl ? '' : ' unset'}" viewBox="0 0 24 24" width="18" height="12" aria-hidden="true"><path d="${LEVEL_PATH}" stroke-width="${lvl ? LEVEL_W[lvl] : 0.75}"/></svg>`
const tick = () => `<svg class="mark mark-tick" viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><path d="M2 6.5 L4.8 9.2 L10 3.2"/></svg>`
const circle = () => `<svg class="mark mark-gap" viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><circle cx="6" cy="6" r="4"/></svg>`
const dash = () => `<svg class="mark mark-focus" viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><path d="M1 6 L11 6"/></svg>`
const accMarks = (r) => `<span class="acc-marks">${r.map((x) => x
  ? `<svg class="mark mark-x" viewBox="0 0 12 12" width="12" height="12" role="img" aria-label="correct"><path d="M2 6.5 L4.8 9.2 L10 3.2"/></svg>`
  : `<svg class="mark mark-x" viewBox="0 0 12 12" width="12" height="12" role="img" aria-label="incorrect"><path d="M2.5 2.5 L9.5 9.5"/><path d="M9.5 2.5 L2.5 9.5"/></svg>`).join('')}</span>`
const sp = (id) => `#/session/${id}/profile`
const stripAuto = (s) => s.replace(/^\[auto\]\s*/, '')
function rel(iso) {
  if (!iso) return ''
  const s = (Date.now() - new Date(iso)) / 1000
  if (s < 3600) return 'just now'
  if (s < 86400) return `${Math.round(s / 3600)} hours ago`
  const d = Math.round(s / 86400)
  if (d < 7) return `${d} days ago`
  if (d < 14) return 'last week'
  return `${Math.round(d / 7)} weeks ago`
}
const wkLabel = (iso) => new Date(iso + 'T00:00:00Z').toLocaleDateString('en-US', { month: 'short', day: 'numeric', timeZone: 'UTC' })
function weekly(points, bw = 16, gap = 8, h = 56) {
  if (!points.some((w) => w.count > 0)) return `<p class="none">none yet</p>`
  const max = Math.max(...points.map((w) => w.count), 1), n = points.length, W = n * bw + (n - 1) * gap
  const bars = points.map((w, i) => { const bh = (w.count / max) * h; return `<rect class="wk-bar" x="${i * (bw + gap)}" y="${h - bh}" width="${bw}" height="${bh}" rx="4" ry="4"><title>Week of ${wkLabel(w.week_start)}: ${w.count} mastered</title></rect>` }).join('')
  const labels = points.map((w, i) => `<span>${(i === 0 || i === n - 1 || (i % 4 === 0 && n - 1 - i >= 2)) ? wkLabel(w.week_start) : ''}</span>`).join('')
  return `<div class="wk"><svg viewBox="0 0 ${W} ${h + 1}" preserveAspectRatio="xMidYMid meet" aria-hidden="true"><line class="wk-base" x1="0" x2="${W}" y1="${h}" y2="${h}"/>${bars}</svg><div class="wk-labels" aria-hidden="true">${labels}</div></div>`
}
const accRow = (c) => `<li class="acc-row"><a class="acc-concept" href="${sp(c.first_seen_session_id)}">${esc(c.concept)}</a><span class="meta">${c.correct_count} of ${c.total_count}</span>${accMarks(c.last_results)}</li>`
function accGroups(all) {
  const least = all.slice(0, 3), names = new Set(least.map((c) => c.concept))
  const most = all.slice(-3).filter((c) => !names.has(c.concept)), lab = least.length && most.length
  const g = (label, rows) => rows.length ? `<div class="acc-group">${lab ? `<p class="acc-label">${label}</p>` : ''}<ul class="acc-list">${rows.map(accRow).join('')}</ul></div>` : ''
  return all.length ? g('Least accurate', least) + g('Most accurate', most) : `<p class="none">none yet</p>`
}
const LEVELS = ['beginner', 'intermediate', 'advanced']
const sessionsWord = (n) => n === 1 ? 'in 1 session' : `in ${n} sessions`
const headHtml = (lede, right = '') => `<header class="head"><div><h1 class="title">Your profile</h1><p class="lede">${lede}</p></div>${right}</header>`
const lastStudied = (d) => d.last_active_at ? ` Last studied ${rel(d.last_active_at)}.` : ''

// ---- Variant A: dividers across sessions ----
function variantA(d) {
  const dist = d.knowledge_level_distribution
  const levelRows = LEVELS.map((l) => `<li class="cue">${levelMark(l)}<span class="level-word">${l}</span><span class="meta">${dist[l]} ${dist[l] === 1 ? 'topic' : 'topics'}</span></li>`).join('')
    + (dist.unknown ? `<li class="cue">${levelMark(null)}<span class="level-word unset">level not set</span><span class="meta">${dist.unknown} ${dist.unknown === 1 ? 'topic' : 'topics'}</span></li>` : '')
  const cueList = (rows, mark, empty) => rows.length ? `<ul class="a-cues">${rows.map((r) => `<li class="cue">${mark()}<a class="cue-word" href="${sp(r.first_seen_session_id)}">${esc(r.concept)}</a>${r.count > 1 ? `<span class="meta">${sessionsWord(r.count)}</span>` : ''}</li>`).join('')}</ul>` : `<p class="none">${empty}</p>`
  const topics = d.recent_topics.map((t) => `<li class="a-topic">
    <a class="tl" href="${sp(t.id)}">${esc(t.topic || 'Untitled')}</a>
    <span class="lv">${levelMark(t.progress?.level)}<span class="level-word${t.progress?.level ? '' : ' unset'}">${t.progress?.level || 'level not set'}</span></span>
    ${t.progress?.focus_target_gap ? `<span class="fo focus-word">${esc(t.progress.focus_target_gap)}</span>` : `<span class="fo none">no focus</span>`}
    <span class="ma meta">${tick()} ${t.progress?.mastered_count || 0} mastered</span>
    <span class="meta">${t.ended_at ? 'ended' : 'active'} ${rel(t.last_activity_at || t.created_at)}</span>
  </li>`).join('')
  return `<section class="prof">
    ${headHtml(`${d.total_sessions} sessions, ${d.active_sessions} active.${lastStudied(d)}`, `<a class="text-btn" href="#/sessions">All sessions</a>`)}
    <section class="divider"><h2 class="divider-tab tab-level">Level <span class="n">${d.total_sessions}</span></h2><div class="divider-body"><ul>${levelRows}</ul></div></section>
    <section class="divider"><h2 class="divider-tab tab-gaps">Gaps <span class="n">${d.combined_confirmed_gaps.length}</span></h2><div class="divider-body">${cueList(d.combined_confirmed_gaps, circle, 'none open')}</div></section>
    <section class="divider"><h2 class="divider-tab tab-mastered">Mastered <span class="n">${d.combined_mastered_concepts.length}</span></h2><div class="divider-body">${cueList(d.combined_mastered_concepts, tick, 'none yet')}</div></section>
    <section class="sec"><h2 class="sec-title">Topics</h2><ul style="width:100%">${topics}</ul><a class="text-btn" href="#/sessions">See all topics</a></section>
    <div class="two">
      <section class="sec"><h2 class="sec-title">Mastered by week</h2>${weekly(d.weekly_mastery)}</section>
      <section class="sec"><h2 class="sec-title">Check accuracy</h2>${accGroups(d.concept_accuracy)}</section>
    </div>
  </section>`
}

// ---- Variant B: topic ledger ----
function variantB(d) {
  const cards = d.recent_topics.map((t) => `<li class="b-card">
    <p class="b-head"><b>${t.ended_at ? 'ended' : 'active'}</b><span>${rel(t.last_activity_at || t.created_at)}</span></p>
    <a class="b-name" href="${sp(t.id)}">${esc(t.topic || 'Untitled')}</a>
    <div class="b-cues">
      <span class="cue">${levelMark(t.progress?.level)}<span class="level-word${t.progress?.level ? '' : ' unset'}">${t.progress?.level || 'level not set'}</span></span>
      <span class="cue">${dash()}${t.progress?.focus_target_gap ? `<span class="level-word focus-word">${esc(t.progress.focus_target_gap)}</span>` : `<span class="none">no focus cue yet</span>`}</span>
      <span class="cue">${tick()}<span class="meta">${t.progress?.mastered_count || 0} mastered</span></span>
    </div>
    ${t.last_session_summary ? `<p class="b-sum">${esc(stripAuto(t.last_session_summary))}</p>` : t.last_message_preview ? `<p class="b-sum prev">${esc(t.last_message_preview)}</p>` : ''}
    <div class="b-actions"><a class="text-btn" href="#/session/${t.id}">${t.ended_at ? 'Resume' : 'Continue'}</a><a class="text-btn" href="${sp(t.id)}">Open profile</a></div>
  </li>`).join('')
  const list = (rows, mark, empty) => rows.length ? `<ul style="width:100%">${rows.slice(0, 6).map((r) => `<li class="cue">${mark()}<a class="cue-word" href="${sp(r.first_seen_session_id)}">${esc(r.concept)}</a>${r.count > 1 ? `<span class="meta">x${r.count}</span>` : ''}</li>`).join('')}</ul>` : `<p class="none">${empty}</p>`
  const least = d.concept_accuracy.slice(0, 4)
  return `<section class="prof">
    ${headHtml(`What the tutor knows about you, topic by topic.${lastStudied(d)}`)}
    <ol class="b-topics">${cards}</ol>
    <p class="b-foot">Showing ${d.recent_topics.length} of ${d.total_sessions} topics. <a class="text-btn" href="#/sessions">See all topics</a></p>
    <div class="two b-across">
      <section class="divider"><h2 class="divider-tab tab-gaps">Gaps <span class="n">${d.combined_confirmed_gaps.length}</span></h2><div class="divider-body">${list(d.combined_confirmed_gaps, circle, 'none open')}</div></section>
      <section class="divider"><h2 class="divider-tab tab-mastered">Mastered <span class="n">${d.combined_mastered_concepts.length}</span></h2><div class="divider-body">${list(d.combined_mastered_concepts, tick, 'none yet')}</div></section>
    </div>
    <div class="two">
      <section class="sec"><h2 class="sec-title">Mastered by week</h2>${weekly(d.weekly_mastery)}</section>
      <section class="sec"><h2 class="sec-title">Needs another pass</h2>${least.length ? `<ul class="acc-list">${least.map(accRow).join('')}</ul>` : `<p class="none">none yet</p>`}</section>
    </div>
  </section>`
}

// ---- Variant C: concept ledger ----
let cFilter = 'all'
function variantC(d) {
  const acc = new Map(d.concept_accuracy.map((c) => [c.concept, c]))
  const rows = [
    ...d.combined_confirmed_gaps.map((g) => ({ ...g, status: 'gap', acc: acc.get(g.concept) || null })),
    ...d.combined_mastered_concepts.map((m) => ({ ...m, status: 'mastered', acc: acc.get(m.concept) || null })),
  ].sort((a, b) => {
    if (a.status !== b.status) return a.status === 'gap' ? -1 : 1
    const aa = a.acc ? a.acc.accuracy : 2, ba = b.acc ? b.acc.accuracy : 2
    if (a.status === 'gap' && aa !== ba) return aa - ba
    return b.count - a.count
  })
  const vis = cFilter === 'all' ? rows : rows.filter((r) => (cFilter === 'gaps' ? r.status === 'gap' : r.status === 'mastered'))
  const ledger = vis.length ? `<ul>${vis.map((r) => `<li class="c-row">
      <span class="rm">${r.status === 'gap' ? circle() : tick()}</span>
      <a class="rc" href="${sp(r.first_seen_session_id)}">${esc(r.concept)}</a>
      <span class="meta">${r.count === 1 ? '1 topic' : `${r.count} topics`}</span>
      ${r.acc ? `<span class="ra"><span class="meta">${r.acc.correct_count} of ${r.acc.total_count}</span>${accMarks(r.acc.last_results)}</span>` : `<span class="ra meta">${r.status === 'gap' ? 'not yet checked' : 'declared'}</span>`}
    </li>`).join('')}</ul>` : `<p class="none">none yet</p>`
  const filters = [['all', 'All'], ['gaps', 'Gaps'], ['mastered', 'Mastered']].map(([k, l]) => `<button class="c-filter${cFilter === k ? ' on' : ''}" data-filter="${k}" aria-pressed="${cFilter === k}">${l}</button>`).join('')
  const dist = d.knowledge_level_distribution
  const topics = d.recent_topics.map((t) => `<li class="c-line">${levelMark(t.progress?.level)}<a href="${sp(t.id)}">${esc(t.topic || 'Untitled')}</a><span class="meta">${t.progress?.mastered_count || 0} mastered</span></li>`).join('')
  const levels = LEVELS.map((l) => `<li class="c-line">${levelMark(l)}<span class="level-word">${l}</span><span class="meta">${dist[l]}</span></li>`).join('')
    + (dist.unknown ? `<li class="c-line">${levelMark(null)}<span class="level-word unset">not set</span><span class="meta">${dist.unknown}</span></li>` : '')
  return `<section class="prof">
    ${headHtml(`${d.combined_confirmed_gaps.length} gaps open, ${d.combined_mastered_concepts.length} concepts mastered across ${d.total_sessions} topics.${lastStudied(d)}`)}
    <div class="c-cols">
      <section class="c-ledger"><div class="c-lh"><h2 class="sec-title">Concepts</h2><div class="c-filters" role="group" aria-label="Filter concepts">${filters}</div></div>${ledger}</section>
      <aside class="c-aside">
        <section class="sec"><h2 class="sec-title">Topics</h2><ul style="width:100%">${topics}</ul><a class="text-btn" href="#/sessions">See all topics</a></section>
        <section class="sec"><h2 class="sec-title">Mastered by week</h2>${weekly(d.weekly_mastery, 12, 6, 44)}</section>
        <section class="sec"><h2 class="sec-title">Level by topic</h2><ul style="width:100%">${levels}</ul></section>
      </aside>
    </div>
  </section>`
}

// ---- switcher ----
const VARIANTS = [
  { key: 'A', name: 'Dividers across sessions', render: variantA },
  { key: 'B', name: 'Topic ledger', render: variantB },
  { key: 'C', name: 'Concept ledger', render: variantC },
]
const params = new URLSearchParams(location.search)
let current = VARIANTS.findIndex((v) => v.key === (params.get('variant') || 'A').toUpperCase()); if (current < 0) current = 0
let useEmpty = params.get('state') === 'empty'
if (params.get('theme') === 'dark') document.documentElement.dataset.theme = 'dark'

function render() {
  const v = VARIANTS[current], data = useEmpty ? EMPTY : FULL
  document.getElementById('label').textContent = `${v.key} - ${v.name}`
  document.getElementById('note').textContent = `prototype: data = ${useEmpty ? 'fixture (empty)' : 'fixture'}`
  document.getElementById('empty').textContent = useEmpty ? 'data' : 'empty'
  document.getElementById('theme').textContent = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'
  const root = document.getElementById('root')
  root.innerHTML = data.total_sessions === 0
    ? `<div class="sec" style="max-width:28rem;margin:0 auto;align-items:center;text-align:center;padding:2rem 1.75rem"><h2 class="title" style="font-size:1.375rem">No sessions yet</h2><p class="none">Start one. Your profile builds itself as you go.</p><a class="text-btn" href="#/">Start your first session</a></div>`
    : v.render(data)
  root.querySelectorAll('[data-filter]').forEach((b) => b.addEventListener('click', () => { cFilter = b.dataset.filter; render() }))
  const p = new URLSearchParams(location.search); p.set('variant', v.key)
  if (useEmpty) p.set('state', 'empty'); else p.delete('state')
  if (document.documentElement.dataset.theme === 'dark') p.set('theme', 'dark'); else p.delete('theme')
  history.replaceState(null, '', `?${p}`)
}
const go = (dlt) => { current = (current + dlt + VARIANTS.length) % VARIANTS.length; render() }
document.getElementById('prev').onclick = () => go(-1)
document.getElementById('next').onclick = () => go(1)
document.getElementById('theme').onclick = () => { const h = document.documentElement; h.dataset.theme = h.dataset.theme === 'dark' ? 'light' : 'dark'; render() }
document.getElementById('empty').onclick = () => { useEmpty = !useEmpty; render() }
window.addEventListener('keydown', (e) => {
  const t = e.target; if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return
  if (e.key === 'ArrowLeft') go(-1); else if (e.key === 'ArrowRight') go(1)
})
render()
</script>
</body>
</html>
