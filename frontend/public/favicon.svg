<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <style>
    .page-outline { stroke: #1b1b1a; }
    .page-rules { stroke: #b9c6da; }
    .page-margin { stroke: #d8433a; }
