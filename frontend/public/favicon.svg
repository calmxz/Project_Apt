      .page-outline { stroke: #ecebe6; }
      .page-rules { stroke: #363b47; }
      .page-margin { stroke: #ff6a5e; }
    }
  </style>
  <rect class="page-outline" x="2.5" y="1.5" width="19" height="21" rx="2" fill="none" stroke-width="1.5" />
  <g class="page-rules" stroke-width="1.5">
    <line x1="11" y1="7.5" x2="18.5" y2="7.5" />
    <line x1="11" y1="12" x2="18.5" y2="12" />
    <line x1="11" y1="16.5" x2="18.5" y2="16.5" />
  </g>
  <line class="page-margin" x1="8" y1="1.5" x2="8" y2="22.5" stroke-width="2.5" />
</svg>
