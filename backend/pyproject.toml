[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptlearn-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<0.120",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0,<3.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.4",
    "litellm>=1.52.0,<2.0",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9,<1.0",
    "pypdf>=4.3,<6.0",
    "tiktoken>=0.7,<1.0",
    "snowballstemmer>=2.2,<4.0",
    "chromadb>=0.5,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "pytest-cov>=5.0",
    "datamodel-code-generator>=0.26,<0.30",
    "openapi-spec-validator>=0.7",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
