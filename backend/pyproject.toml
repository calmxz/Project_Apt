[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "crux-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.120,<0.136.3",  # MAL-2026-4750: 0.136.3 flagged malicious by pip-audit (amazon-inspector)
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0,<3.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.14.1",
    "litellm>=1.85.1,<2.0",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.18,<1.0",
    "pypdf>=6.10.2,<7.0",
    "python-pptx>=1.0.2",
    "tiktoken>=0.13.0,<1.0",
    "snowballstemmer>=3.1.0,<4.0",
    "psycopg[binary]>=3.3.4,<4.0",
    "pgvector>=0.3,<1.0",
    "alembic>=1.18.4,<2.0",
    "pyjwt[crypto]>=2.9,<3.0",
    "httpx>=0.28.1,<1.0",
    "boto3>=1.35,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28.1",
    "pytest-cov>=5.0",
    "datamodel-code-generator>=0.68.1,<0.69",
    "openapi-spec-validator>=0.7",
    "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=services --cov=lib --cov-report=term-missing --cov-fail-under=75"

[tool.coverage.run]
omit = ["tests/*", "scripts/*"]
