name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: pip install -e .[dev]

      - name: Validate OpenAPI spec
        working-directory: .
        run: python -m openapi_spec_validator docs/api/openapi.yaml

      - name: Verify generated contracts match openapi.yaml
        working-directory: .
        run: |
          python backend/scripts/gen_contracts.py
          git diff --exit-code backend/contracts/
          # Catch untracked new files codegen may emit
          test -z "$(git status --porcelain backend/contracts/)"

      - name: Test
        run: pytest -v

  frontend:
    name: Frontend (Vitest + lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit -- --run

      - name: Build
        run: npm run build
