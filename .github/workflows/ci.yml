name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: pip install -e .[dev]

      - name: Validate OpenAPI spec
        working-directory: .
        run: python -m openapi_spec_validator docs/api/openapi.yaml

      - name: Verify generated contracts match openapi.yaml
        working-directory: .
        run: |
          python backend/scripts/gen_contracts.py
          git diff --exit-code backend/contracts/
          # Catch untracked new files codegen may emit
          test -z "$(git status --porcelain backend/contracts/)"

      - name: Test
        run: pytest -v

  frontend:
    name: Frontend (Vitest + lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests + coverage
        run: npm run test:unit:coverage

      - name: Build
        run: npm run build

  e2e:
    name: E2E (Playwright)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        working-directory: backend
        run: pip install -e .[dev]

      - name: Start backend
        working-directory: backend
        env:
          LLM_STUB: '1'
        run: nohup uvicorn main:app --port 8000 > backend.log 2>&1 &

      - name: Wait for backend /healthz
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/healthz; then echo " ready"; exit 0; fi
            sleep 1
          done
          echo "backend did not become ready in 30s"
          cat backend/backend.log || true
          exit 1

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run e2e
        working-directory: frontend
        env:
          CI: 'true'
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Upload backend log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-log
          path: backend/backend.log
          retention-days: 3
