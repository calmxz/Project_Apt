name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: pip install -e .[dev]

      - name: Validate OpenAPI spec
        working-directory: .
        run: python -m openapi_spec_validator docs/api/openapi.yaml

      - name: Verify generated contracts match openapi.yaml
        working-directory: .
        run: |
          python backend/scripts/gen_contracts.py
          git diff --exit-code backend/contracts/
          # Catch untracked new files codegen may emit
          test -z "$(git status --porcelain backend/contracts/)"

      - name: Test
        run: pytest -v --cov-report=xml

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: backend/coverage.xml
          flags: backend
          fail_ci_if_error: false

  frontend:
    name: Frontend (Vitest + lint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests + coverage
        run: npm run test:unit:coverage

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          directory: frontend/coverage
          flags: frontend
          fail_ci_if_error: false

      - name: Build
        run: npm run build

  security:
    name: Security (SAST + deps + secrets + images)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gitleaks needs full history

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: pip-audit (backend deps)
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: backend/

      - name: npm install (frontend, for audit)
        working-directory: frontend
        run: npm ci

      - name: npm audit (frontend, prod deps, high+)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      - name: gitleaks (secret scan, full history)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: hadolint (backend Dockerfile)
        uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: backend/Dockerfile
          failure-threshold: warning

      - name: hadolint (frontend Dockerfile)
        uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: frontend/Dockerfile
          failure-threshold: warning

      - name: Install bandit + semgrep
        run: pip install bandit semgrep

      - name: bandit (backend SAST, high sev + high conf only)
        run: bandit -r backend -lll -iii -x backend/tests,backend/scripts

      - name: semgrep (OWASP top-10 + audit rulesets)
        run: semgrep ci --config p/owasp-top-ten --config p/security-audit
        env:
          SEMGREP_RULES: "p/owasp-top-ten p/security-audit"

      - name: Build backend image (for trivy)
        run: docker build -t adaptlearn-backend:ci backend

      - name: Build frontend image (for trivy)
        run: docker build -t adaptlearn-frontend:ci frontend

      - name: trivy (backend image, CRITICAL only)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: adaptlearn-backend:ci
          format: table
          exit-code: '1'
          severity: CRITICAL
          ignore-unfixed: true

      - name: trivy (frontend image, CRITICAL only)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: adaptlearn-frontend:ci
          format: table
          exit-code: '1'
          severity: CRITICAL
          ignore-unfixed: true
