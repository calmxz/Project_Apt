name: CI

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: frontend

jobs:
  frontend:
    name: Frontend (Vitest + lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint -- --no-fix || true

      - name: Unit tests
        run: npm run test:unit -- --run

      - name: Build
        run: npm run build

  functions:
    name: Functions (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: adaptlearn/functions/requirements-dev.txt

      - name: Install pytest only (smoke tier)
        working-directory: frontend/functions
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Smoke tests
        working-directory: frontend/functions
        run: pytest

      # Phase 2+ adds a second pytest run with full requirements installed.
      # Keep smoke tier above so a broken requirements pin can't block frontend CI.
