openapi: 3.1.0
info:
  title: Crux API
  version: 0.1.0
  summary: Backend contract for Crux v1 (Phases 2-5).
  description: |
    Source of truth for Crux HTTP contracts. Pydantic models under
    `backend/contracts/` are generated from this document via
    `backend/scripts/gen_contracts.py`. Edit YAML, then regen.

    See `docs/superpowers/specs/2026-05-03-crux-v1-design.md`
    sections 3.3, 3.4, 4.1-4.4, 5 for upstream design constraints.

servers:
  - url: http://localhost:8000
    description: Local development backend

security:
  - BearerAuth: []

tags:
  - name: health
    description: Liveness check.
  - name: chat
    description: Chat turn (tutor agent loop).
  - name: sessions
    description: Session lifecycle (create, list, end, resume).
  - name: profile
    description: Topic profile debug + read (Phase 2+).
  - name: upload
    description: PDF ingestion (Phase 4).
  - name: documents
    description: Document management (delete reference files).

paths:
  /health:
    get:
      tags: [health]
      summary: Health probe.
      operationId: getHealth
      responses:
        "200":
          description: Service is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/sessions:
    post:
      tags: [sessions]
      summary: Create a new session (fresh or resume).
      operationId: createSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionCreateRequest"
      responses:
        "201":
          description: Session created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
    get:
      tags: [sessions]
      summary: List sessions for the authenticated user.
      operationId: listSessions
      responses:
        "200":
          description: Sessions grouped/sorted by recency.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SessionListItem"

  /api/sessions/library:
    get:
      tags: [sessions]
      summary: Paginated, filterable, searchable session library.
      operationId: listSessionLibrary
      parameters:
        - in: query
          name: status
          required: false
          schema: { type: string, enum: [active, ended, all], default: all }
        - in: query
          name: q
          required: false
          schema: { type: [string, "null"], default: null }
        - in: query
          name: sort
          required: false
          schema: { type: string, enum: [last_activity, created, topic], default: last_activity }
        - in: query
          name: limit
          required: false
          schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
        - in: query
          name: offset
          required: false
          schema: { type: integer, default: 0, minimum: 0 }
      responses:
        "200":
          description: A page of sessions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionLibraryPage"

  /api/sessions/{session_id}:
    get:
      tags: [sessions]
      summary: Get a single session with its full message transcript.
      operationId: getSession
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Session detail with messages.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionDetail"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [sessions]
      summary: Update a session's topic and/or pinned state.
      operationId: updateSession
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionUpdateRequest"
      responses:
        "200":
          description: Session updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/sessions/{session_id}/end:
    post:
      tags: [sessions]
      summary: End a session and produce a summary.
      operationId: endSession
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Session ended.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionEndResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/sessions/{session_id}/reopen:
    post:
      tags: [sessions]
      summary: Reopen a previously ended session (flips ended_at to null).
      operationId: reopenSession
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Session reopened.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/sessions/{session_id}/ingestion:
    get:
      tags: [sessions]
      summary: Aggregate ingestion status for a session's reference documents.
      operationId: getSessionIngestion
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Session-wide ingestion status plus per-document detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionIngestionStatus"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/upload:
    post:
      tags: [upload]
      summary: Upload a reference file (PDF, PPTX, TXT, or MD) to attach to a session (background ingestion).
      description: |
        Accepted file types are validated by extension: .pdf, .pptx, .txt, .md
        (.markdown is also accepted). The 25 MB per-request cap and background
        ingestion behaviour are unchanged.
      operationId: uploadPdf
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [session_id, file]
              properties:
                session_id:
                  type: string
                  maxLength: 64
                file:
                  type: string
                  format: binary
      responses:
        "202":
          description: Accepted; ingestion runs in background.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/upload/{document_id}:
    get:
      tags: [upload]
      summary: Poll ingestion status for an uploaded document.
      operationId: getUploadStatus
      parameters:
        - in: path
          name: document_id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Current ingestion status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadStatus"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/documents/{document_id}:
    delete:
      tags: [documents]
      summary: Delete an uploaded reference document and its embeddings.
      operationId: deleteDocument
      parameters:
        - in: path
          name: document_id
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Document deleted.
        "404":
          $ref: "#/components/responses/NotFound"

  /api/profile/aggregate:
    get:
      tags: [profile]
      summary: Cross-session aggregate profile dashboard.
      description: |
        Aggregates TopicProfile fields and LearningEvent counts across every
        session for the given user. Pure SQL/Python — no LLM calls.
      operationId: getAggregateProfile
      responses:
        "200":
          description: Aggregate snapshot across all sessions for the user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AggregateProfileResponse"

  /api/profile/{session_id}:
    get:
      tags: [profile]
      summary: Read a session's topic profile plus recent learning events.
      operationId: getProfile
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Profile snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [profile]
      summary: Add a list item and/or set knowledge level. Optimistic-concurrency guarded.
      operationId: patchProfile
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfilePatchRequest" }
      responses:
        "200":
          description: Updated profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfileMutationResponse" }
        "404": { $ref: "#/components/responses/NotFound" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }

  /api/profile/{session_id}/mastered_concepts/{item}:
    delete:
      tags: [profile]
      summary: Remove one mastered concept. Optimistic-concurrency guarded.
      operationId: deleteMasteredConcept
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - name: item
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: Updated profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfileMutationResponse" }
        "404": { $ref: "#/components/responses/NotFound" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }

  /api/profile/{session_id}/confirmed_gaps/{item}:
    delete:
      tags: [profile]
      summary: Remove one confirmed gap (nulls focus if it was the focus). Optimistic-concurrency guarded.
      operationId: deleteConfirmedGap
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - name: item
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: Updated profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfileMutationResponse" }
        "404": { $ref: "#/components/responses/NotFound" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Supabase-issued JWT. Server validates against Supabase JWKS and
        resolves the request's `user_id` from the `sub` claim. Replaces the
        Phase 6-and-earlier convention of passing `user_id` via body/query.

  parameters:
    SessionId:
      in: path
      name: session_id
      required: true
      schema: { type: string, maxLength: 64 }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag from the last profile read. Guards against clobbering a concurrent write.
      schema: { type: string }

  responses:
    BadRequest:
      description: Malformed request.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    RateLimited:
      description: Daily usage cap reached.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    PayloadTooLarge:
      description: Uploaded file exceeds the per-request size cap.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    UpstreamUnavailable:
      description: LLM provider timeout or unavailable.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    PreconditionFailed:
      description: If-Match did not match the current profile; refetch and retry.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    PreconditionRequired:
      description: If-Match header missing.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }

  schemas:
    # ---- Enums (string literals) ----
    KnowledgeLevel:
      type: string
      enum: [beginner, intermediate, advanced]

    EvidenceType:
      type: string
      enum: [declared, inferred, tested]

    FocusClearReason:
      type: string
      enum: [demonstrated, tested_correct, user_redirected]

    IngestionStatus:
      type: string
      enum: [pending, ready, failed]

    ToolStatus:
      type: string
      enum: [ok, failed, no_results]

    SeedMode:
      type: string
      enum: [fresh, resume]

    # ---- Core domain ----
    TopicProfile:
      type: object
      additionalProperties: false
      properties:
        knowledge_level:
          oneOf:
            - $ref: "#/components/schemas/KnowledgeLevel"
            - type: "null"
          default: null
        confirmed_gaps:
          type: array
          items: { type: string }
          default: []
        mastered_concepts:
          type: array
          items: { type: string }
          default: []
        focus_target_gap:
          type: [string, "null"]
          default: null
        last_session_summary:
          type: [string, "null"]
          default: null

    Citation:
      type: object
      additionalProperties: false
      required: [doc_id, text]
      properties:
        doc_id:   { type: string }
        text:     { type: string }
        page:     { type: [integer, "null"], default: null }
        doc_name: { type: [string, "null"], default: null }

    ToolCallRecord:
      type: object
      additionalProperties: false
      required: [name, args, status]
      properties:
        name:   { type: string }
        args:   { type: object, additionalProperties: true }
        status: { $ref: "#/components/schemas/ToolStatus" }
        error:
          type: [string, "null"]
          default: null

    LearningEventResponse:
      type: object
      additionalProperties: false
      required: [id, session_id, gap_tested, question, correct, created_at]
      properties:
        id:              { type: integer }
        session_id:      { type: string }
        gap_tested:      { type: string }
        question:        { type: string }
        correct:         { type: boolean }
        created_at:      { type: string, format: date-time }
        selected_index:  { type: [integer, "null"], default: null }
        correct_index:   { type: [integer, "null"], default: null }
        purpose:         { type: [string, "null"], default: null }

    # ---- Tool argument schemas (LiteLLM tool params) ----
    UpdateTopicProfileArgs:
      type: object
      additionalProperties: false
      required: [session_id]
      description: |
        Patch operation for a session's TopicProfile. Sending
        `focus_target_gap: null` explicitly clears focus and requires
        `focus_clear_reason` (server-side guard rail). `evidence_type` is
        required only when `add_mastered_concept` is present.
      properties:
        session_id:           { type: string, maxLength: 64 }
        knowledge_level:
          oneOf:
            - $ref: "#/components/schemas/KnowledgeLevel"
            - type: "null"
          default: null
        add_confirmed_gap:    { type: [string, "null"], default: null, maxLength: 200 }
        add_mastered_concept: { type: [string, "null"], default: null, maxLength: 200 }
        focus_target_gap:     { type: [string, "null"], default: null, maxLength: 200 }
        focus_clear_reason:
          oneOf:
            - $ref: "#/components/schemas/FocusClearReason"
            - type: "null"
          default: null
        evidence_type:
          oneOf:
            - $ref: "#/components/schemas/EvidenceType"
            - type: "null"
          default: null

    RetrieveChunksArgs:
      type: object
      additionalProperties: false
      required: [session_id, query]
      properties:
        session_id: { type: string, maxLength: 64 }
        query:      { type: string, maxLength: 500 }
        k:          { type: integer, default: 5, minimum: 1, maximum: 20 }

    AskCheckQuestionsArgs:
      type: object
      additionalProperties: false
      required: [session_id, gap, items]
      description: |
        Register an ordered batch of 1..5 multiple-choice check-questions and end
        the turn. The first question's text is also streamed as assistant text.
        Per-item correct_index must be < len(options); that cross-field rule is
        enforced in check_question_service, not here.
      properties:
        session_id: { type: string, maxLength: 64 }
        gap:        { type: string, maxLength: 200 }
        items:
          type: array
          minItems: 1
          maxItems: 5
          items:
            type: object
            additionalProperties: false
            required: [question, options, correct_index, explanation]
            properties:
              question:      { type: string, maxLength: 1000 }
              options:
                type: array
                minItems: 2
                maxItems: 4
                items: { type: string, maxLength: 200 }
              correct_index: { type: integer, minimum: 0 }
              explanation:   { type: string, maxLength: 500 }

    PendingCheck:
      type: object
      additionalProperties: false
      required: [gap, current_index, total, items]
      description: |
        An open check-question BATCH awaiting learner answers. PUBLIC projection.
        Per item: question + options always present. correct_index, explanation,
        selected_index, correct are present ONLY for already-answered or skipped
        items - never leaked for pending ones.
      properties:
        gap:           { type: string }
        current_index: { type: integer }
        total:         { type: integer }
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [question, options, status]
            properties:
              question: { type: string }
              options:  { type: array, items: { type: string } }
              status:   { type: string, enum: [pending, answered, skipped] }
              selected_index: { type: [integer, "null"], default: null }
              correct_index:  { type: [integer, "null"], default: null }
              correct:        { type: [boolean, "null"], default: null }
              explanation:    { type: [string, "null"],  default: null }

    CheckAnswerRequest:
      type: object
      additionalProperties: false
      required: [index, selected_index]
      description: A learner's clicked answer to item `index` of the open batch.
      properties:
        index:          { type: integer, minimum: 0 }
        selected_index: { type: integer, minimum: 0 }

    CheckAnswerResponse:
      type: object
      additionalProperties: false
      required: [correct, explanation, correct_index, current_index, total, has_next, done]
      description: Deterministic grade of a clicked answer plus batch progress.
      properties:
        correct:       { type: boolean }
        explanation:   { type: string }
        correct_index: { type: integer }
        current_index: { type: integer }
        total:         { type: integer }
        has_next:      { type: boolean }
        done:          { type: boolean }

    CheckSkipRequest:
      type: object
      additionalProperties: false
      required: [index]
      description: Skip item `index` of the open batch (no LearningEvent).
      properties:
        index: { type: integer, minimum: 0 }

    CheckSkipResponse:
      type: object
      additionalProperties: false
      required: [current_index, total, has_next, done]
      description: Batch progress state after a skipped item.
      properties:
        current_index: { type: integer }
        total:         { type: integer }
        has_next:      { type: boolean }
        done:          { type: boolean }

    ToolResult:
      type: object
      additionalProperties: false
      required: [ok, status]
      properties:
        ok:     { type: boolean }
        status: { $ref: "#/components/schemas/ToolStatus" }
        error:  { type: [string, "null"], default: null }
        data:
          type: [object, "null"]
          additionalProperties: true
          default: null

    # ---- Request / response envelopes ----
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string }

    ChatRequest:
      type: object
      additionalProperties: false
      required: [session_id, message]
      properties:
        session_id:  { type: string, maxLength: 64 }
        message:     { type: string, maxLength: 4000 }
        review_gaps: { type: boolean, default: false }

    SessionCreateRequest:
      type: object
      additionalProperties: false
      required: [topic, seed_mode]
      properties:
        topic:             { type: string, maxLength: 200 }
        seed_mode:         { $ref: "#/components/schemas/SeedMode" }
        prior_session_id:  { type: [string, "null"], default: null, maxLength: 64 }

    SessionUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        topic:  { type: string, maxLength: 200 }
        pinned: { type: boolean }

    SessionResponse:
      type: object
      additionalProperties: false
      required: [id, user_id, topic, topic_profile, created_at]
      properties:
        id:                { type: string }
        user_id:           { type: string }
        topic:             { type: string }
        topic_profile:     { $ref: "#/components/schemas/TopicProfile" }
        created_at:        { type: string, format: date-time }
        ended_at:          { type: [string, "null"], format: date-time, default: null }
        ingestion_status:
          oneOf:
            - $ref: "#/components/schemas/IngestionStatus"
            - type: "null"
          default: null
        pinned:            { type: boolean, default: false }

    SessionProgress:
      type: object
      additionalProperties: false
      required: [mastered_count]
      description: Lightweight learning-progress signal for a session card.
      properties:
        focus_target_gap: { type: [string, "null"], default: null }
        mastered_count:   { type: integer, default: 0 }

    SessionListItem:
      type: object
      additionalProperties: false
      required: [id, topic, created_at]
      properties:
        id:                   { type: string }
        topic:                { type: string }
        created_at:           { type: string, format: date-time }
        ended_at:             { type: [string, "null"], format: date-time, default: null }
        pinned:               { type: boolean, default: false }
        message_count:        { type: integer, default: 0 }
        last_activity_at:     { type: [string, "null"], format: date-time, default: null }
        last_message_preview: { type: [string, "null"], default: null }
        last_session_summary: { type: [string, "null"], default: null }
        progress:
          oneOf:
            - $ref: "#/components/schemas/SessionProgress"
            - type: "null"
          default: null

    Message:
      type: object
      additionalProperties: false
      required: [id, role, content, created_at]
      description: A single chat turn persisted in the session transcript.
      properties:
        id:         { type: integer }
        role:       { type: string }
        content:    { type: string }
        created_at: { type: string, format: date-time }
        citations:
          type: array
          items: { $ref: "#/components/schemas/Citation" }
          default: []
        tool_calls:
          type: array
          items: { $ref: "#/components/schemas/ToolCallRecord" }
          default: []
        check_batch:
          oneOf:
            - $ref: "#/components/schemas/PendingCheck"
            - type: "null"
          default: null

    SessionDetail:
      type: object
      additionalProperties: false
      required: [id, user_id, topic, topic_profile, created_at, messages]
      description: SessionResponse plus full message transcript.
      properties:
        id:                { type: string }
        user_id:           { type: string }
        topic:             { type: string }
        topic_profile:     { $ref: "#/components/schemas/TopicProfile" }
        created_at:        { type: string, format: date-time }
        ended_at:          { type: [string, "null"], format: date-time, default: null }
        ingestion_status:
          oneOf:
            - $ref: "#/components/schemas/IngestionStatus"
            - type: "null"
          default: null
        pinned:            { type: boolean, default: false }
        pending_check:
          oneOf:
            - $ref: "#/components/schemas/PendingCheck"
            - type: "null"
          default: null
        messages:
          type: array
          items: { $ref: "#/components/schemas/Message" }

    SessionLibraryPage:
      type: object
      additionalProperties: false
      required: [items, total, limit, offset]
      description: One page of the session library.
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/SessionListItem" }
        total:  { type: integer }
        limit:  { type: integer }
        offset: { type: integer }

    SessionEndSummaryKind:
      type: string
      enum: [summary, no_exchanges]

    SessionEndSummary:
      type: object
      additionalProperties: false
      required: [kind, text]
      description: |
        Structured payload describing how a session ended. Frontend branches on
        `kind` to render friendly copy. Legacy [auto] strings have been removed.
      properties:
        kind: { $ref: "#/components/schemas/SessionEndSummaryKind" }
        text: { type: string }

    SessionEndResponse:
      type: object
      additionalProperties: false
      required: [id, ended_at, summary]
      properties:
        id:       { type: string }
        ended_at: { type: string, format: date-time }
        summary:  { $ref: "#/components/schemas/SessionEndSummary" }

    UploadResponse:
      type: object
      additionalProperties: false
      required: [document_id, session_id, filename, status]
      properties:
        document_id: { type: integer }
        session_id:  { type: string }
        filename:    { type: string }
        status:      { $ref: "#/components/schemas/IngestionStatus" }

    UploadStatus:
      type: object
      additionalProperties: false
      required: [id, status]
      description: Ingestion state for an uploaded document; polled by the UI.
      properties:
        id:     { type: integer }
        status: { $ref: "#/components/schemas/IngestionStatus" }
        error:  { type: [string, "null"], default: null }

    DocumentStatus:
      type: object
      additionalProperties: false
      required: [id, filename, status]
      description: Ingestion state for one uploaded document.
      properties:
        id:       { type: integer }
        filename: { type: string }
        status:   { $ref: "#/components/schemas/IngestionStatus" }
        error:    { type: [string, "null"], default: null }

    SessionIngestionStatus:
      type: object
      additionalProperties: false
      required: [status, documents]
      description: |-
        Session-wide ingestion aggregate. `status` is `pending` if any document
        is still ingesting, else `ready` if any document is ready, else `failed`,
        else null when the session has no documents.
      properties:
        status:
          oneOf:
            - $ref: "#/components/schemas/IngestionStatus"
            - type: "null"
          default: null
        documents:
          type: array
          items: { $ref: "#/components/schemas/DocumentStatus" }

    ProfileResponse:
      type: object
      additionalProperties: false
      required: [profile, recent_learning_events, etag]
      properties:
        profile: { $ref: "#/components/schemas/TopicProfile" }
        recent_learning_events:
          type: array
          items: { $ref: "#/components/schemas/LearningEventResponse" }
        etag:
          type: string
          description: sha256 hex of the serialized profile; send back as If-Match on writes.

    ProfilePatchRequest:
      type: object
      additionalProperties: false
      description: |
        Add one item to a list and/or set the knowledge level. At least one
        field must be present. Adding an item to one list removes it from the
        other (mutual exclusion).
      properties:
        add_mastered:
          type: string
          minLength: 1
          maxLength: 200
        add_gap:
          type: string
          minLength: 1
          maxLength: 200
        knowledge_level:
          type: string
          enum: [beginner, intermediate, advanced]

    ProfileMutationResponse:
      type: object
      additionalProperties: false
      required: [profile, etag]
      properties:
        profile: { $ref: "#/components/schemas/TopicProfile" }
        etag: { type: string }

    AggregateConceptCount:
      type: object
      additionalProperties: false
      required: [concept, count, first_seen_session_id]
      description: |
        Concept (mastered or gap) plus how many sessions it appears in and the
        earliest session id where it was recorded.
      properties:
        concept: { type: string }
        count: { type: integer, minimum: 1 }
        first_seen_session_id: { type: string }

    KnowledgeLevelDistribution:
      type: object
      additionalProperties: false
      required: [beginner, intermediate, advanced, unknown]
      description: |
        Count of sessions per knowledge_level (unknown = null knowledge_level).
      properties:
        beginner: { type: integer, minimum: 0 }
        intermediate: { type: integer, minimum: 0 }
        advanced: { type: integer, minimum: 0 }
        unknown: { type: integer, minimum: 0 }

    RecentSessionSummary:
      type: object
      additionalProperties: false
      required: [id, topic, created_at]
      description: Compact session header for the "recent topics" widget.
      properties:
        id: { type: string }
        topic: { type: string }
        created_at: { type: string, format: date-time }
        ended_at: { type: [string, "null"], format: date-time, default: null }
        last_session_summary: { type: [string, "null"], default: null }
        message_count: { type: integer, default: 0 }
        last_activity_at: { type: [string, "null"], format: date-time, default: null }
        last_message_preview: { type: [string, "null"], default: null }
        progress:
          oneOf:
            - $ref: "#/components/schemas/SessionProgress"
            - type: "null"
          default: null

    AggregateProfileResponse:
      type: object
      additionalProperties: false
      required:
        - total_sessions
        - active_sessions
        - ended_sessions
        - total_learning_events
        - combined_mastered_concepts
        - combined_confirmed_gaps
        - knowledge_level_distribution
        - recent_topics
      description: |
        Cross-session aggregate view powering the top-level /profile dashboard.
        All arrays are sorted by count desc (mastered + gaps) or created_at desc
        (recent_topics).
      properties:
        total_sessions: { type: integer, minimum: 0 }
        active_sessions: { type: integer, minimum: 0 }
        ended_sessions: { type: integer, minimum: 0 }
        total_learning_events: { type: integer, minimum: 0 }
        last_active_at:
          type: [string, "null"]
          format: date-time
          default: null
        combined_mastered_concepts:
          type: array
          items: { $ref: "#/components/schemas/AggregateConceptCount" }
        combined_confirmed_gaps:
          type: array
          items: { $ref: "#/components/schemas/AggregateConceptCount" }
        knowledge_level_distribution:
          $ref: "#/components/schemas/KnowledgeLevelDistribution"
        recent_topics:
          type: array
          items: { $ref: "#/components/schemas/RecentSessionSummary" }

    ErrorResponse:
      type: object
      additionalProperties: false
      required: [detail]
      properties:
        detail: { type: string }

# ---------------------------------------------------------------------------
# SSE event contract reference (vendor extension — not processed by codegen)
# Describes the Server-Sent Events emitted by POST /chat/stream.
# Field names must match what agent/tutor.py actually yields.
# ---------------------------------------------------------------------------

x-sse-events:
  tool_call_start:
    data:
      type: object
      required: [id, name, args]
      properties:
        id:   { type: string }
        name: { type: string }
        args: { type: object }

  tool_call_done:
    data:
      type: object
      required: [id, status]
      properties:
        id:      { type: string }
        status:  { type: string, enum: [ok, error] }
        summary: { type: [string, "null"], default: null }
        error:   { type: [string, "null"], default: null }

  assistant_delta:
    data:
      type: object
      required: [text]
      properties:
        text: { type: string }

  citations:
    data:
      type: array
      items:
        type: object
        required: [doc_id]
        properties:
          doc_id:   { type: string }
          text:     { type: [string, "null"], default: null }
          page:     { type: [integer, "null"], default: null }
          doc_name: { type: [string, "null"], default: null }

  cost_warning:
    data:
      type: object
      required: [level, used_usd, soft_cap_usd, urgent_cap_usd, hard_cap_usd]
      properties:
        level:          { type: string, enum: [soft, urgent] }
        used_usd:       { type: string }
        soft_cap_usd:   { type: string }
        urgent_cap_usd: { type: string }
        hard_cap_usd:   { type: string }

  done:
    data:
      type: object
      required: [message_id]
      properties:
        message_id:    { type: string }
        total_cost_usd: { type: [string, "null"], default: null }

  cancelled:
    data:
      type: object
      required: [message_id, partial_content_chars, estimated_cost_usd]
      properties:
        message_id:           { type: string }
        partial_content_chars: { type: integer }
        estimated_cost_usd:   { type: string }

  error:
    data:
      type: object
      required: [code]
      properties:
        code:         { type: string }
        message:      { type: [string, "null"], default: null }
        used_usd:     { type: [string, "null"], default: null }
        soft_cap_usd: { type: [string, "null"], default: null }
        hard_cap_usd: { type: [string, "null"], default: null }
