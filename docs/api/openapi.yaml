openapi: 3.1.0
info:
  title: AdaptLearn API
  version: 0.1.0
  summary: Backend contract for AdaptLearn v1 (Phases 2-5).
  description: |
    Source of truth for AdaptLearn HTTP contracts. Pydantic models under
    `backend/contracts/` are generated from this document via
    `backend/scripts/gen_contracts.py`. Edit YAML, then regen.

    See `docs/superpowers/specs/2026-05-03-adaptlearn-v1-design.md`
    sections 3.3, 3.4, 4.1-4.4, 5 for upstream design constraints.

servers:
  - url: http://localhost:8000
    description: Local development backend

security:
  - BearerAuth: []

tags:
  - name: health
    description: Liveness check.
  - name: chat
    description: Chat turn (tutor agent loop).
  - name: sessions
    description: Session lifecycle (create, list, end, resume).
  - name: profile
    description: Topic profile debug + read (Phase 2+).
  - name: upload
    description: PDF ingestion (Phase 4).

paths:
  /health:
    get:
      tags: [health]
      summary: Health probe.
      operationId: getHealth
      responses:
        "200":
          description: Service is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/chat:
    post:
      tags: [chat]
      summary: Send a chat message and receive tutor response.
      operationId: postChat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: Tutor response with any tool calls and citations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/UpstreamUnavailable"

  /api/sessions:
    post:
      tags: [sessions]
      summary: Create a new session (fresh or resume).
      operationId: createSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionCreateRequest"
      responses:
        "201":
          description: Session created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
    get:
      tags: [sessions]
      summary: List sessions for the authenticated user.
      operationId: listSessions
      responses:
        "200":
          description: Sessions grouped/sorted by recency.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SessionListItem"

  /api/sessions/{session_id}:
    get:
      tags: [sessions]
      summary: Get a single session with its full message transcript.
      operationId: getSession
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Session detail with messages.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionDetail"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/sessions/{session_id}/end:
    post:
      tags: [sessions]
      summary: End a session and produce a summary.
      operationId: endSession
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Session ended.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionEndResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/sessions/{session_id}/reopen:
    post:
      tags: [sessions]
      summary: Reopen a previously ended session (flips ended_at to null).
      operationId: reopenSession
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Session reopened.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/upload:
    post:
      tags: [upload]
      summary: Upload a PDF to attach to a session (background ingestion).
      operationId: uploadPdf
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [session_id, file]
              properties:
                session_id:
                  type: string
                  maxLength: 64
                file:
                  type: string
                  format: binary
      responses:
        "202":
          description: Accepted; ingestion runs in background.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/upload/{document_id}:
    get:
      tags: [upload]
      summary: Poll ingestion status for an uploaded document.
      operationId: getUploadStatus
      parameters:
        - in: path
          name: document_id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Current ingestion status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadStatus"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/profile/aggregate:
    get:
      tags: [profile]
      summary: Cross-session aggregate profile dashboard.
      description: |
        Aggregates TopicProfile fields and LearningEvent counts across every
        session for the given user. Pure SQL/Python — no LLM calls.
      operationId: getAggregateProfile
      responses:
        "200":
          description: Aggregate snapshot across all sessions for the user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AggregateProfileResponse"

  /api/profile/{session_id}:
    get:
      tags: [profile]
      summary: Read a session's topic profile plus recent learning events.
      operationId: getProfile
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Profile snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileResponse"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Supabase-issued JWT. Server validates against Supabase JWKS and
        resolves the request's `user_id` from the `sub` claim. Replaces the
        Phase 6-and-earlier convention of passing `user_id` via body/query.

  parameters:
    SessionId:
      in: path
      name: session_id
      required: true
      schema: { type: string, maxLength: 64 }

  responses:
    BadRequest:
      description: Malformed request.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    RateLimited:
      description: Daily usage cap reached.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    PayloadTooLarge:
      description: Uploaded file exceeds the per-request size cap.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    UpstreamUnavailable:
      description: LLM provider timeout or unavailable.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }

  schemas:
    # ---- Enums (string literals) ----
    KnowledgeLevel:
      type: string
      enum: [beginner, intermediate, advanced]

    EvidenceType:
      type: string
      enum: [declared, inferred, tested]

    FocusClearReason:
      type: string
      enum: [demonstrated, tested_correct, user_redirected]

    IngestionStatus:
      type: string
      enum: [pending, ready, failed]

    ToolStatus:
      type: string
      enum: [ok, failed, no_results]

    SeedMode:
      type: string
      enum: [fresh, resume]

    # ---- Core domain ----
    TopicProfile:
      type: object
      additionalProperties: false
      properties:
        knowledge_level:
          oneOf:
            - $ref: "#/components/schemas/KnowledgeLevel"
            - type: "null"
          default: null
        confirmed_gaps:
          type: array
          items: { type: string }
          default: []
        mastered_concepts:
          type: array
          items: { type: string }
          default: []
        focus_target_gap:
          type: [string, "null"]
          default: null
        last_session_summary:
          type: [string, "null"]
          default: null

    Citation:
      type: object
      additionalProperties: false
      required: [doc_id, text]
      properties:
        doc_id:   { type: string }
        text:     { type: string }
        page:     { type: [integer, "null"], default: null }
        doc_name: { type: [string, "null"], default: null }

    ToolCallRecord:
      type: object
      additionalProperties: false
      required: [name, args, status]
      properties:
        name:   { type: string }
        args:   { type: object, additionalProperties: true }
        status: { $ref: "#/components/schemas/ToolStatus" }
        error:
          type: [string, "null"]
          default: null

    LearningEventResponse:
      type: object
      additionalProperties: false
      required: [id, session_id, gap_tested, question, correct, created_at]
      properties:
        id:          { type: integer }
        session_id:  { type: string }
        gap_tested:  { type: string }
        question:    { type: string }
        correct:     { type: boolean }
        created_at:  { type: string, format: date-time }

    # ---- Tool argument schemas (LiteLLM tool params) ----
    UpdateTopicProfileArgs:
      type: object
      additionalProperties: false
      required: [session_id, evidence_type]
      description: |
        Patch operation for a session's TopicProfile. Sending
        `focus_target_gap: null` explicitly clears focus and requires
        `focus_clear_reason` (server-side guard rail).
      properties:
        session_id:           { type: string, maxLength: 64 }
        knowledge_level:
          oneOf:
            - $ref: "#/components/schemas/KnowledgeLevel"
            - type: "null"
          default: null
        add_confirmed_gap:    { type: [string, "null"], default: null, maxLength: 200 }
        add_mastered_concept: { type: [string, "null"], default: null, maxLength: 200 }
        focus_target_gap:     { type: [string, "null"], default: null, maxLength: 200 }
        focus_clear_reason:
          oneOf:
            - $ref: "#/components/schemas/FocusClearReason"
            - type: "null"
          default: null
        evidence_type:        { $ref: "#/components/schemas/EvidenceType" }

    RetrieveChunksArgs:
      type: object
      additionalProperties: false
      required: [session_id, query]
      properties:
        session_id: { type: string, maxLength: 64 }
        query:      { type: string, maxLength: 500 }
        k:          { type: integer, default: 5, minimum: 1, maximum: 20 }

    RecordLearningEventArgs:
      type: object
      additionalProperties: false
      required: [session_id, gap_tested, question, correct]
      properties:
        session_id: { type: string, maxLength: 64 }
        gap_tested: { type: string, maxLength: 200 }
        question:   { type: string, maxLength: 1000 }
        correct:    { type: boolean }

    ToolResult:
      type: object
      additionalProperties: false
      required: [ok, status]
      properties:
        ok:     { type: boolean }
        status: { $ref: "#/components/schemas/ToolStatus" }
        error:  { type: [string, "null"], default: null }
        data:
          type: [object, "null"]
          additionalProperties: true
          default: null

    # ---- Request / response envelopes ----
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string }

    ChatRequest:
      type: object
      additionalProperties: false
      required: [session_id, message]
      properties:
        session_id: { type: string, maxLength: 64 }
        message:    { type: string, maxLength: 4000 }

    ChatResponse:
      type: object
      additionalProperties: false
      required: [assistant_message, message_id]
      properties:
        assistant_message: { type: string }
        message_id:        { type: integer }
        tool_calls:
          type: array
          items: { $ref: "#/components/schemas/ToolCallRecord" }
          default: []
        citations:
          type: array
          items: { $ref: "#/components/schemas/Citation" }
          default: []

    SessionCreateRequest:
      type: object
      additionalProperties: false
      required: [topic, seed_mode]
      properties:
        topic:             { type: string, maxLength: 200 }
        seed_mode:         { $ref: "#/components/schemas/SeedMode" }
        prior_session_id:  { type: [string, "null"], default: null, maxLength: 64 }

    SessionResponse:
      type: object
      additionalProperties: false
      required: [id, user_id, topic, topic_profile, created_at]
      properties:
        id:                { type: string }
        user_id:           { type: string }
        topic:             { type: string }
        topic_profile:     { $ref: "#/components/schemas/TopicProfile" }
        created_at:        { type: string, format: date-time }
        ended_at:          { type: [string, "null"], format: date-time, default: null }
        ingestion_status:
          oneOf:
            - $ref: "#/components/schemas/IngestionStatus"
            - type: "null"
          default: null

    SessionListItem:
      type: object
      additionalProperties: false
      required: [id, topic, created_at]
      properties:
        id:         { type: string }
        topic:      { type: string }
        created_at: { type: string, format: date-time }
        ended_at:   { type: [string, "null"], format: date-time, default: null }

    Message:
      type: object
      additionalProperties: false
      required: [id, role, content, created_at]
      description: A single chat turn persisted in the session transcript.
      properties:
        id:         { type: integer }
        role:       { type: string }
        content:    { type: string }
        created_at: { type: string, format: date-time }
        citations:
          type: array
          items: { $ref: "#/components/schemas/Citation" }
          default: []

    SessionDetail:
      type: object
      additionalProperties: false
      required: [id, user_id, topic, topic_profile, created_at, messages]
      description: SessionResponse plus full message transcript.
      properties:
        id:                { type: string }
        user_id:           { type: string }
        topic:             { type: string }
        topic_profile:     { $ref: "#/components/schemas/TopicProfile" }
        created_at:        { type: string, format: date-time }
        ended_at:          { type: [string, "null"], format: date-time, default: null }
        ingestion_status:
          oneOf:
            - $ref: "#/components/schemas/IngestionStatus"
            - type: "null"
          default: null
        messages:
          type: array
          items: { $ref: "#/components/schemas/Message" }

    SessionEndSummaryKind:
      type: string
      enum: [summary, no_exchanges]

    SessionEndSummary:
      type: object
      additionalProperties: false
      required: [kind, text]
      description: |
        Structured payload describing how a session ended. Frontend branches on
        `kind` to render friendly copy. Legacy [auto] strings have been removed.
      properties:
        kind: { $ref: "#/components/schemas/SessionEndSummaryKind" }
        text: { type: string }

    SessionEndResponse:
      type: object
      additionalProperties: false
      required: [id, ended_at, summary]
      properties:
        id:       { type: string }
        ended_at: { type: string, format: date-time }
        summary:  { $ref: "#/components/schemas/SessionEndSummary" }

    UploadResponse:
      type: object
      additionalProperties: false
      required: [document_id, session_id, filename, status]
      properties:
        document_id: { type: integer }
        session_id:  { type: string }
        filename:    { type: string }
        status:      { $ref: "#/components/schemas/IngestionStatus" }

    UploadStatus:
      type: object
      additionalProperties: false
      required: [id, status]
      description: Ingestion state for an uploaded document; polled by the UI.
      properties:
        id:     { type: integer }
        status: { $ref: "#/components/schemas/IngestionStatus" }
        error:  { type: [string, "null"], default: null }

    ProfileResponse:
      type: object
      additionalProperties: false
      required: [profile, recent_learning_events]
      properties:
        profile: { $ref: "#/components/schemas/TopicProfile" }
        recent_learning_events:
          type: array
          items: { $ref: "#/components/schemas/LearningEventResponse" }

    AggregateConceptCount:
      type: object
      additionalProperties: false
      required: [concept, count, first_seen_session_id]
      description: |
        Concept (mastered or gap) plus how many sessions it appears in and the
        earliest session id where it was recorded.
      properties:
        concept: { type: string }
        count: { type: integer, minimum: 1 }
        first_seen_session_id: { type: string }

    KnowledgeLevelDistribution:
      type: object
      additionalProperties: false
      required: [beginner, intermediate, advanced, unknown]
      description: |
        Count of sessions per knowledge_level (unknown = null knowledge_level).
      properties:
        beginner: { type: integer, minimum: 0 }
        intermediate: { type: integer, minimum: 0 }
        advanced: { type: integer, minimum: 0 }
        unknown: { type: integer, minimum: 0 }

    RecentSessionSummary:
      type: object
      additionalProperties: false
      required: [id, topic, created_at]
      description: Compact session header for the "recent topics" widget.
      properties:
        id: { type: string }
        topic: { type: string }
        created_at: { type: string, format: date-time }
        ended_at: { type: [string, "null"], format: date-time, default: null }
        last_session_summary: { type: [string, "null"], default: null }

    AggregateProfileResponse:
      type: object
      additionalProperties: false
      required:
        - total_sessions
        - active_sessions
        - ended_sessions
        - total_learning_events
        - combined_mastered_concepts
        - combined_confirmed_gaps
        - knowledge_level_distribution
        - recent_topics
      description: |
        Cross-session aggregate view powering the top-level /profile dashboard.
        All arrays are sorted by count desc (mastered + gaps) or created_at desc
        (recent_topics).
      properties:
        total_sessions: { type: integer, minimum: 0 }
        active_sessions: { type: integer, minimum: 0 }
        ended_sessions: { type: integer, minimum: 0 }
        total_learning_events: { type: integer, minimum: 0 }
        last_active_at:
          type: [string, "null"]
          format: date-time
          default: null
        combined_mastered_concepts:
          type: array
          items: { $ref: "#/components/schemas/AggregateConceptCount" }
        combined_confirmed_gaps:
          type: array
          items: { $ref: "#/components/schemas/AggregateConceptCount" }
        knowledge_level_distribution:
          $ref: "#/components/schemas/KnowledgeLevelDistribution"
        recent_topics:
          type: array
          items: { $ref: "#/components/schemas/RecentSessionSummary" }

    ErrorResponse:
      type: object
      additionalProperties: false
      required: [detail]
      properties:
        detail: { type: string }

# ---------------------------------------------------------------------------
# SSE event contract reference (vendor extension — not processed by codegen)
# Describes the Server-Sent Events emitted by POST /chat/stream.
# Field names must match what agent/tutor.py actually yields.
# ---------------------------------------------------------------------------

x-sse-events:
  tool_call_start:
    data:
      type: object
      required: [id, name, args]
      properties:
        id:   { type: string }
        name: { type: string }
        args: { type: object }

  tool_call_done:
    data:
      type: object
      required: [id, status]
      properties:
        id:      { type: string }
        status:  { type: string, enum: [ok, error] }
        summary: { type: [string, "null"], default: null }
        error:   { type: [string, "null"], default: null }

  assistant_delta:
    data:
      type: object
      required: [text]
      properties:
        text: { type: string }

  citations:
    data:
      type: array
      items:
        type: object
        required: [doc_id]
        properties:
          doc_id:   { type: string }
          text:     { type: [string, "null"], default: null }
          page:     { type: [integer, "null"], default: null }
          doc_name: { type: [string, "null"], default: null }

  cost_warning:
    data:
      type: object
      required: [code, used_usd, soft_cap_usd, hard_cap_usd]
      properties:
        code:         { type: string }
        used_usd:     { type: string }
        soft_cap_usd: { type: string }
        hard_cap_usd: { type: string }

  done:
    data:
      type: object
      required: [message_id]
      properties:
        message_id:    { type: string }
        total_cost_usd: { type: [string, "null"], default: null }

  cancelled:
    data:
      type: object
      required: [message_id, partial_content_chars, estimated_cost_usd]
      properties:
        message_id:           { type: string }
        partial_content_chars: { type: integer }
        estimated_cost_usd:   { type: string }

  error:
    data:
      type: object
      required: [code]
      properties:
        code:         { type: string }
        message:      { type: [string, "null"], default: null }
        used_usd:     { type: [string, "null"], default: null }
        soft_cap_usd: { type: [string, "null"], default: null }
        hard_cap_usd: { type: [string, "null"], default: null }
