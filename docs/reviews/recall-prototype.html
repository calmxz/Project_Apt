<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>Recall page prototype (#351)</title>
<!-- PROTOTYPE, throwaway. Standalone view of the three Recall page
     structures from frontend/src/prototype/recall/. Same tokens and fonts
     as the app, pulled in by relative path; open this file directly. -->
<link rel="stylesheet" href="../../frontend/src/assets/fonts.css">
<link rel="stylesheet" href="../../frontend/src/assets/base.css">
<style>
/* ---------- harness (not part of the design) ---------- */
.harness {
  position: fixed; left: 50%; bottom: 1rem; transform: translateX(-50%); z-index: 9999;
  display: flex; align-items: center; gap: 0.5rem; padding: 0.4rem 0.75rem;
  border-radius: 999px; background: #111; color: #fff;
  font: 600 13px/1.2 system-ui, sans-serif; box-shadow: 0 6px 20px rgba(0,0,0,.35);
}
.harness button { border: 0; background: #333; color: #fff; border-radius: 999px; padding: 0 0.6rem; height: 28px; cursor: pointer; font: inherit; }
.harness button[aria-pressed="true"] { background: #fff; color: #111; }
.harness .sep { width: 1px; height: 18px; background: #444; }
.harness em { font-weight: 400; opacity: .7; }

.frame { min-height: 100vh; }
.frame.narrow { max-width: 390px; margin: 0 auto; border-left: 1px dashed var(--rule-strong); border-right: 1px dashed var(--rule-strong); }

/* Stand-in for the app shell: a strip of desk-deep where the sidebar would sit, so cards are judged against something. */
.shell { display: grid; grid-template-columns: 18rem minmax(0, 1fr); }
.frame.narrow .shell { grid-template-columns: minmax(0, 1fr); }
.side { background: var(--desk-deep); border-right: 1px solid var(--rule); min-height: 100vh; padding: 1.25rem 1rem; color: var(--pencil); font-size: var(--fs-caption); }
.frame.narrow .side { display: none; }
.side b { display: block; color: var(--ink); font-family: var(--font-display); font-size: var(--fs-h3); margin-bottom: 1rem; }
.side .row { padding: 0.5rem 0; border-bottom: 1px solid var(--rule); }
.side .row.on { color: var(--ink-learner); }
.main { padding: 0 1.5rem 6rem; }
.frame.narrow .main { padding: 0 1rem 6rem; }

/* ---------- host page (ReviewView.vue) ---------- */
.review { max-width: 44rem; margin: 0 auto; padding-top: 1.75rem; display: flex; flex-direction: column; gap: 1.75rem; }
.back { align-self: flex-start; color: var(--ink-learner); font-size: var(--fs-caption); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
.head { display: flex; flex-direction: column; }
.title { margin: 0; font-family: var(--font-display); font-size: 1.75rem; font-weight: 600; letter-spacing: var(--tracking-display); line-height: var(--lh-display); color: var(--ink); }
.lede { margin: 0; font-size: var(--fs-body); line-height: var(--lh-body); color: var(--pencil); }
.flash { margin: 0; font-size: var(--fs-caption); color: var(--pencil); min-height: 1.5em; }

button { font-family: var(--font-sans); }
.blue-link { padding: 0; border: 0; background: transparent; color: var(--ink-learner); font-size: var(--fs-caption); font-weight: 700; line-height: var(--lh-body); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.blue-link:hover { color: var(--color-accent-hover); }
:focus-visible { outline: 2px solid var(--color-accent-ring); outline-offset: 2px; }

/* ---------- A Ledger ---------- */
.ledger { display: flex; flex-direction: column; gap: .5rem; }
.ledger .count { margin: 0; font-size: var(--fs-caption); color: var(--pencil); }
.ledger .rows { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--rule-strong); }
.ledger .row { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,12rem) 8.5rem 2.5rem; align-items: center; column-gap: 1rem; min-height: 3.5rem; border-bottom: 1px solid var(--rule); }
.ledger .cue { display: flex; align-items: center; gap: .5rem; min-width: 0; padding: 0; border: 0; background: transparent; color: var(--ink-learner); font-size: var(--fs-body); line-height: var(--lh-body); text-align: left; cursor: pointer; }
.ledger .concept { overflow-wrap: anywhere; }
.ledger .arrow { flex: 0 0 auto; opacity: 0; transition: opacity var(--motion-fast); }
.ledger .cue:hover .concept { color: var(--color-accent-hover); text-decoration: underline; text-underline-offset: 3px; }
.ledger .cue:hover .arrow, .ledger .cue:focus-visible .arrow { opacity: 1; }
.ledger .from, .ledger .when { font-size: var(--fs-caption); color: var(--pencil); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ledger .when { text-align: right; }
.ledger .tally { display: flex; justify-content: flex-end; color: var(--ink); }
.ledger .tally-none { color: var(--pencil); font-size: var(--fs-caption); }
.ledger .empty { margin: 0; padding: 1rem 0; border-top: 1px solid var(--rule-strong); border-bottom: 1px solid var(--rule); color: var(--pencil); }
.narrow .ledger .row { grid-template-columns: minmax(0,1fr) auto; grid-template-areas: 'cue cue' 'from when' 'tally tally'; padding: .5rem 0; min-height: 0; }
.narrow .ledger .cue { grid-area: cue; } .narrow .ledger .from { grid-area: from; } .narrow .ledger .when { grid-area: when; }
.narrow .ledger .tally { grid-area: tally; justify-content: flex-start; }

/* ---------- B Dividers ---------- */
.dividers { display: flex; flex-direction: column; gap: 1.5rem; }
.dividers .group { display: flex; flex-direction: column; }
.dividers .tab { display: inline-flex; align-items: baseline; gap: .625rem; align-self: flex-start; position: relative; z-index: 1; margin-bottom: -1px; padding: .5rem 1rem; border: 1px solid var(--card-edge); border-bottom: 0; border-radius: var(--radius-card) var(--radius-card) 0 0; background: var(--card); color: var(--ink); font-size: var(--fs-caption); font-weight: 700; max-width: 100%; }
.dividers .tab-topic { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dividers .tab-count { flex: 0 0 auto; font-weight: 400; color: var(--pencil); }
.dividers .sheet { display: flex; flex-direction: column; gap: 1rem; padding: 1rem; background: var(--card); border: 1px solid var(--card-edge); border-radius: 0 var(--radius-card) var(--radius-card) var(--radius-card); box-shadow: 0 1px 0 var(--card-drop); }
.dividers .cards { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(13rem,1fr)); gap: .75rem; }
.dividers .card { display: flex; flex-direction: column; gap: .125rem; width: 100%; min-height: 5.5rem; padding: .625rem .75rem; border: 1px solid var(--card-learner-edge); border-radius: var(--radius-card); background: var(--card-learner); box-shadow: 0 1px 0 var(--card-drop); color: var(--ink-learner); text-align: left; cursor: pointer; }
.dividers .card-head, .dividers .card-streak { font-size: var(--fs-label); line-height: var(--lh-body); color: var(--pencil); }
.dividers .card-concept { font-size: var(--fs-body); font-weight: 700; line-height: var(--lh-body); overflow-wrap: anywhere; }
.dividers .card:hover .card-concept { color: var(--color-accent-hover); text-decoration: underline; text-underline-offset: 3px; }
.dividers .check-group { display: flex; flex-wrap: wrap; align-items: baseline; gap: .25rem .75rem; align-self: flex-start; text-align: left; }
.dividers .check-group-first { font-weight: 400; color: var(--pencil); text-decoration: none; }
.dividers .empty { margin: 0; color: var(--pencil); }
.narrow .dividers .cards { grid-template-columns: minmax(0,1fr); }
.narrow .dividers .card { min-height: 0; }
.narrow .dividers .sheet { padding: .75rem; }

/* ---------- C Stack ---------- */
.stackpage { display: flex; flex-direction: column; align-items: center; gap: 1rem; }
.stackpage .fan { position: relative; width: 100%; max-width: 32rem; padding-bottom: 1.25rem; }
.stackpage .card { position: relative; z-index: 2; display: flex; flex-direction: column; gap: .25rem; width: 100%; min-height: 14rem; padding: 1.25rem 1.5rem 1.5rem; background: var(--card); border: 1px solid var(--card-edge); border-top: 3px solid var(--ink); border-radius: var(--radius-card); box-shadow: 0 1px 0 var(--card-drop); animation: card-in var(--motion-base) var(--motion-out-expo) both; box-sizing: border-box; }
@keyframes card-in { from { opacity: 0 } to { opacity: 1 } }
@media (prefers-reduced-motion: reduce) { .stackpage .card { animation: none } }
.stackpage .ghost { position: absolute; left: 0; right: 0; height: 3rem; background: var(--card); border: 1px solid var(--card-edge); border-radius: var(--radius-card); box-shadow: 0 1px 0 var(--card-drop); }
.stackpage .ghost-1 { bottom: .625rem; margin: 0 .5rem; z-index: 1; }
.stackpage .ghost-2 { bottom: 0; margin: 0 1rem; z-index: 0; }
.stackpage .card-head { margin: 0; font-size: var(--fs-label); color: var(--pencil); }
.stackpage .card-concept { margin: .25rem 0 0; font-family: var(--font-display); font-size: var(--fs-h2); font-weight: 600; letter-spacing: var(--tracking-display); line-height: var(--lh-display); color: var(--ink); overflow-wrap: anywhere; }
.stackpage .card-concept-empty { color: var(--pencil); }
.stackpage .card-streak { margin: 0; font-size: var(--fs-caption); color: var(--pencil); }
.stackpage .card-actions { display: flex; align-items: baseline; gap: 1.25rem; margin-top: auto; padding-top: 1rem; }
.stackpage .go { display: inline-flex; align-items: center; gap: .375rem; padding: 0; border: 0; background: transparent; color: var(--ink-learner); font-size: var(--fs-body); font-weight: 700; cursor: pointer; }
.stackpage .go:hover { color: var(--color-accent-hover); text-decoration: underline; text-underline-offset: 3px; }
.stackpage .behind { margin: 0; font-size: var(--fs-caption); color: var(--pencil); }
.stackpage .all { width: 100%; max-width: 32rem; margin-top: 1rem; }
.stackpage summary { cursor: pointer; font-size: var(--fs-caption); font-weight: 700; color: var(--ink-learner); text-decoration: underline; text-underline-offset: 3px; }
.stackpage .all-list { list-style: none; margin: .5rem 0 0; padding: 0; border-top: 1px solid var(--rule-strong); }
.stackpage .all-row { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; min-height: 2.5rem; border-bottom: 1px solid var(--rule); }
.stackpage .all-cue { min-width: 0; padding: 0; border: 0; background: transparent; color: var(--ink-learner); font-size: var(--fs-caption); text-align: left; cursor: pointer; overflow-wrap: anywhere; }
.stackpage .all-cue:hover { color: var(--color-accent-hover); text-decoration: underline; text-underline-offset: 3px; }
.stackpage .all-meta { font-size: var(--fs-label); color: var(--pencil); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stackpage .card-empty { max-width: 32rem; min-height: 0; }
.narrow .stackpage .card { min-height: 12rem; padding: 1rem 1rem 1.25rem; }
.narrow .stackpage .ghost-1 { margin: 0 .375rem; } .narrow .stackpage .ghost-2 { margin: 0 .75rem; }
.narrow .stackpage .all-row { flex-direction: column; align-items: flex-start; gap: 0; padding: .375rem 0; }
.narrow .stackpage .all-meta { white-space: normal; }
</style>
</head>
<body>
<div class="frame" id="frame">
  <div class="shell">
    <aside class="side" aria-hidden="true">
      <b>Crux</b>
      <div class="row">Home</div>
      <div class="row">Library</div>
      <div class="row on">Recall</div>
      <div class="row">Settings</div>
    </aside>
    <main class="main">
      <section class="review">
        <a class="back" href="#">Back</a>
        <header class="head">
          <h1 class="title">Recall</h1>
          <p class="lede">Concepts due for a quick check.</p>
          <p class="lede">Each check that you get right extends the gap before the next one.</p>
        </header>
        <div id="variant"></div>
        <p class="flash" id="flash" role="status"></p>
      </section>
    </main>
  </div>
</div>

<div class="harness" role="group" aria-label="Prototype controls">
  <button data-v="A">A Ledger</button>
  <button data-v="B">B Dividers</button>
  <button data-v="C">C Stack</button>
  <span class="sep"></span>
  <button id="t-dark">dark</button>
  <button id="t-narrow">390px</button>
  <button id="t-empty">empty</button>
  <em>arrow keys cycle</em>
</div>

<script>
const HOUR = 3600000, DAY = 24 * HOUR;
const ago = ms => new Date(Date.now() - ms).toISOString();
const S1 = { id: 's1', topic: 'Photosynthesis' }, S2 = { id: 's2', topic: 'Limits and continuity' }, S3 = { id: 's3', topic: 'Origins of the Cold War' };
const mk = (concept, s, streak, over, last) => ({ concept, source_session_id: s.id, source_topic: s.topic, streak, due_at: ago(over), last_tested_at: ago(last) });
const ITEMS = [
  mk('Calvin cycle', S1, 4, 9 * DAY, 30 * DAY),
  mk('Light-dependent reactions', S1, 2, 6 * DAY, 14 * DAY),
  mk('Epsilon-delta definition of a limit', S2, 1, 3 * DAY, 6 * DAY),
  mk('Stomata and gas exchange', S1, 3, 2 * DAY, 16 * DAY),
  mk('Squeeze theorem', S2, 0, 1 * DAY, 2 * DAY),
  mk('Containment policy', S3, 2, 20 * HOUR, 8 * DAY),
  mk('Removable vs jump discontinuities', S2, 1, 5 * HOUR, 4 * DAY),
  mk('Marshall Plan', S3, 1, 2 * HOUR, 3 * DAY),
];
function dueSince(d) {
  const ms = Date.now() - new Date(d).getTime();
  if (ms < HOUR) return 'due now';
  if (ms < DAY) { const h = Math.floor(ms / HOUR); return `due ${h} hour${h === 1 ? '' : 's'} ago`; }
  const days = Math.floor(ms / DAY);
  if (days === 1) return 'due yesterday';
  if (days < 14) return `due ${days} days ago`;
  return `due ${Math.floor(days / 7)} weeks ago`;
}
const streakLabel = n => !n ? 'not yet held' : n === 1 ? '1 correct in a row' : `${n} correct in a row`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const ARROW = '<svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M3 9h11M10 4.5L14.5 9 10 13.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
function tally(n) {
  if (!n) return '<span class="tally-none">&ndash;</span>';
  const k = Math.min(n, 5); let s = `<svg width="${k * 6 + 2}" height="14" viewBox="0 0 32 14">`;
  for (let i = 1; i <= k; i++) s += `<line x1="${i * 6 - 3}" y1="1.5" x2="${i * 6 - 4}" y2="12.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>`;
  return s + '</svg>';
}
const HOME = '<a class="blue-link" href="#">Back home</a>';

const state = { v: sessionStorage.getItem('recall-v') || 'A', empty: false, order: ITEMS.map(i => i.concept) };
const items = () => state.empty ? [] : ITEMS;

function renderA(list) {
  if (!list.length) return `<section class="ledger"><p class="empty">Nothing due. Concepts you hold come back here when a check is due. ${HOME}</p></section>`;
  return `<section class="ledger"><p class="count">${list.length} due, most overdue first.</p><ol class="rows">` + list.map(it => `
    <li class="row">
      <button class="cue" data-start="${esc(it.concept)}" aria-label="Check ${esc(it.concept)}, from ${esc(it.source_topic)}, ${dueSince(it.due_at)}, ${streakLabel(it.streak)}"><span class="concept">${esc(it.concept)}</span>${ARROW.replace('<svg', '<svg class="arrow"')}</button>
      <span class="from">${esc(it.source_topic)}</span>
      <span class="when">${dueSince(it.due_at)}</span>
      <span class="tally" title="${streakLabel(it.streak)}">${tally(it.streak)}</span>
    </li>`).join('') + '</ol></section>';
}

function renderB(list) {
  if (!list.length) return `<section class="dividers"><div class="group"><div class="tab"><span class="tab-topic">Nothing due</span></div><div class="sheet"><p class="empty">No divider has a concept due. Finish a session and its concepts file themselves here when a check comes round.</p>${HOME}</div></div></section>`;
  const groups = []; const map = new Map();
  for (const it of list) { let g = map.get(it.source_session_id); if (!g) { g = { topic: it.source_topic, items: [] }; map.set(it.source_session_id, g); groups.push(g); } g.items.push(it); }
  return '<section class="dividers">' + groups.map(g => `
    <div class="group">
      <div class="tab"><span class="tab-topic">${esc(g.topic)}</span><span class="tab-count">${g.items.length} due</span></div>
      <div class="sheet">
        <ul class="cards">${g.items.map(it => `<li><button class="card" data-start="${esc(it.concept)}"><span class="card-head">${dueSince(it.due_at)}</span><span class="card-concept">${esc(it.concept)}</span><span class="card-streak">${streakLabel(it.streak)}</span></button></li>`).join('')}</ul>
        <button class="blue-link check-group" data-start="${esc(g.items[0].concept)}">Check ${esc(g.topic)} now <span class="check-group-first">starts with ${esc(g.items[0].concept)}</span></button>
      </div>
    </div>`).join('') + '</section>';
}

function renderC(list) {
  if (!list.length) return `<section class="stackpage"><article class="card card-empty"><p class="card-head">Nothing due</p><h2 class="card-concept card-concept-empty">The box is clear.</h2><p class="card-streak">Concepts you hold come back here when a check is due.</p><div class="card-actions">${HOME}</div></article></section>`;
  const stack = state.order.map(k => list.find(i => i.concept === k)).filter(Boolean);
  const top = stack[0], rest = stack.slice(1);
  const behind = rest.length === 0 ? 'Last one in the box.' : rest.length === 1 ? '1 more behind it.' : `${rest.length} more behind it.`;
  return `<section class="stackpage">
    <div class="fan">
      ${rest.length > 1 ? '<div class="ghost ghost-2"></div>' : ''}${rest.length > 0 ? '<div class="ghost ghost-1"></div>' : ''}
      <article class="card" aria-live="polite">
        <p class="card-head">${dueSince(top.due_at)} &middot; from ${esc(top.source_topic)}</p>
        <h2 class="card-concept">${esc(top.concept)}</h2>
        <p class="card-streak">${streakLabel(top.streak)}</p>
        <div class="card-actions">
          <button class="go" data-start="${esc(top.concept)}">Check this one ${ARROW}</button>
          ${rest.length ? '<button class="blue-link" id="later">Not now</button>' : ''}
        </div>
      </article>
    </div>
    <p class="behind">${behind}</p>
    <details class="all"><summary>All ${stack.length} due</summary><ol class="all-list">${stack.map(it => `<li class="all-row"><button class="all-cue" data-start="${esc(it.concept)}">${esc(it.concept)}</button><span class="all-meta">${esc(it.source_topic)} &middot; ${dueSince(it.due_at)}</span></li>`).join('')}</ol></details>
  </section>`;
}

const R = { A: renderA, B: renderB, C: renderC };
function render() {
  document.getElementById('variant').innerHTML = R[state.v](items());
  document.querySelectorAll('.harness [data-v]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === state.v)));
  sessionStorage.setItem('recall-v', state.v);
}
function say(t) { const f = document.getElementById('flash'); f.textContent = t; clearTimeout(say.t); say.t = setTimeout(() => (f.textContent = ''), 2600); }

document.addEventListener('click', e => {
  const s = e.target.closest('[data-start]');
  if (s) { const it = ITEMS.find(i => i.concept === s.dataset.start); say(`Would start a Recall check on "${it.concept}" in a new session continued from ${it.source_topic}.`); return; }
  if (e.target.id === 'later') { const [h, ...t] = state.order; state.order = [...t, h]; render(); return; }
  const v = e.target.closest('.harness [data-v]');
  if (v) { state.v = v.dataset.v; render(); }
});
document.getElementById('t-dark').onclick = function () {
  const on = document.documentElement.getAttribute('data-theme') !== 'dark';
  document.documentElement.setAttribute('data-theme', on ? 'dark' : 'light'); this.setAttribute('aria-pressed', String(on));
};
document.getElementById('t-narrow').onclick = function () {
  const on = document.getElementById('frame').classList.toggle('narrow'); this.setAttribute('aria-pressed', String(on));
};
document.getElementById('t-empty').onclick = function () {
  state.empty = !state.empty; this.setAttribute('aria-pressed', String(state.empty)); render();
};
window.addEventListener('keydown', e => {
  const keys = ['A', 'B', 'C']; const i = keys.indexOf(state.v);
  if (e.key === 'ArrowRight') { state.v = keys[(i + 1) % 3]; render(); }
  if (e.key === 'ArrowLeft') { state.v = keys[(i + 2) % 3]; render(); }
});
render();
</script>
</body>
</html>
